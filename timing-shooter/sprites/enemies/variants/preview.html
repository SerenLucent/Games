<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mafia Variants</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202226;color:#f4f4f4;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:24px}h2{font-size:19px}section{border-top:1px solid #62666b;padding:18px 0}button,select{font:inherit;padding:9px;background:#35393e;color:white;border:1px solid #888;border-radius:4px}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap}.stage{height:320px;display:flex;justify-content:center;align-items:end;background:#41464a;margin:12px 0}.stage img{height:100%;max-width:100%;object-fit:contain}.stage canvas{height:100%;max-width:100%;object-fit:contain}.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.frames canvas{width:100%;background:#41464a}h3{font-size:15px;margin-bottom:8px}output{align-self:center} @media(max-width:500px){main{padding:12px}.stage{height:280px}.frames{gap:3px}}
</style>
<main><h1>Mafia Variants</h1><div id="variants"></div></main>
<script type="module">
const image = src => new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});
for(const file of ['mafia_short_slim_v1.json','mafia_burly_v1.json']){
 const data=await fetch(file).then(r=>r.json());
 const atlas=await image(data.atlas);
 const overrides=new Map();
 for(const frame of data.frames)if(frame.image&&!overrides.has(frame.image))overrides.set(frame.image,await image(frame.image));
 const section=document.createElement('section');section.dataset.id=data.id;
 section.innerHTML=`<h2>${data.name}</h2><div class="controls"><select aria-label="판정"><option>Perfect</option><option>Great</option></select><button class="play" title="재생">▶</button><button class="reset" title="조준 자세">↺</button><output>조준</output></div><div class="stage"><img src="${data.aim}" alt="${data.name} 조준"><canvas hidden></canvas></div>`;
 document.querySelector('#variants').append(section);
 const canvas=section.querySelector('.stage canvas');[canvas.width,canvas.height]=data.logicalFrameSize;
 const aim=section.querySelector('img'),out=section.querySelector('output');let timer=0;
 function draw(c,f){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(f.image?overrides.get(f.image):atlas,...f.source,...(f.destination??[data.drawOffsetX??0,f.offsetY,f.source[2],f.source[3]]));}
 function reset(){clearTimeout(timer);canvas.hidden=true;aim.hidden=false;out.value='조준';section.dataset.frame='aim';}
 section.querySelector('.reset').onclick=reset;
 section.querySelector('.play').onclick=()=>{clearTimeout(timer);const grade=section.querySelector('select').value;const frames=data.frames.filter(f=>f.grade===grade);aim.hidden=true;canvas.hidden=false;let i=0;function next(){draw(canvas,frames[i]);section.dataset.frame=String(i);out.value=`${grade} ${i+1} / 4`;if(i<3)timer=setTimeout(()=>{i++;next();},frames[i].durationMs);}next();};
 for(const grade of ['Perfect','Great']){
  const h=document.createElement('h3');h.textContent=grade;section.append(h);
  const row=document.createElement('div');row.className='frames';section.append(row);
  if(grade==='Great'){
   row.style.gridTemplateColumns='repeat(5,minmax(0,1fr))';
   const reference=document.createElement('canvas');[reference.width,reference.height]=data.logicalFrameSize;
   reference.title='조준 기준';reference.dataset.reference='aim';
   const original=await image(data.aim),height=data.logicalFrameSize[1],width=height*original.naturalWidth/original.naturalHeight;
   reference.getContext('2d').drawImage(original,(reference.width-width)/2,data.groundY-height*.94,width,height);
   row.append(reference);
  }
  for(const f of data.frames.filter(f=>f.grade===grade)){const c=document.createElement('canvas');[c.width,c.height]=data.logicalFrameSize;c.title=`${grade} ${f.index+1}`;draw(c,f);row.append(c);}
 }
}
await Promise.all([...document.images].map(img=>img.decode()));
window.previewReady=true;
</script>
</html>
