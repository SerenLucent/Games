    }

    async function startGameMode({ fromTitle = false } = {}) {
      if (gameStarted || transitionLocked || opening.active) return;
      transitionLocked = true;
      if (fromTitle) playOneShot(titleTapSound);
      startGameButton.disabled = true;
      showLoading('Now Loading...');
      stopBgm();
      const unlockDone = unlockBgm();
      const assetsReady = Promise.all([opening.prepare(), prepareCombatAssets(), warmStageMusic(), waitMs(350)]);
      const fadeDone = runFadeTransition({
        fadeOutMs: 500,
        fadeInMs: 400,
        swap: async () => {
          await assetsReady;
          titleScreen.classList.add('hidden');
          modeScreen.classList.add('hidden');
          hideLoading();
          tutorial.start();
        }
      });
      try {
        await Promise.all([unlockDone, fadeDone]);
        await tutorial.done;
        opening.play({
          mode: selectedMode,
          onBreach: () => prepareCombatAssets().catch((error) => console.warn('[Stage] Preload failed:', error)),
          onShot: () => {
            playOneShot(gunSound);
            playBgmSequence('stage1', 'sound/stage1_1.mp3', 'sound/stage1_2.mp3');
          },
          onComplete: enterStageAfterOpening
        }).catch((error) => {
          console.error('[Opening] Scene failed:', error);
          enterStageAfterOpening();
        });
      } catch (error) {
        console.error('[Opening] Could not load scene:', error);
        screenFade.classList.remove('visible');
        startGameButton.disabled = false;
        hideLoading();
      } finally {
        transitionLocked = false;
      }
    }

    function warmStageMusic({ decode = true } = {}) {
      const load = decode ? loadBgmBuffer : downloadBgm;
      return Promise.all([
        load('sound/stage1_1.mp3'),
        load('sound/stage1_2.mp3')
      ]).catch((error) => console.warn('[BGM] Stage preload failed:', error));
    }

    let combatAssetsReady = null;
    const combatPreloads = [];
    function prepareCombatAssets() {
      if (combatAssetsReady) return combatAssetsReady;
      const sources = [...Object.values(enemySprites), 'sprites/UI/hp_frame.png',
        'sprites/effects/hit_blood_overlay.png',
        ...[1, 2, 3].map((frame) => `sprites/effects/bullet_effect_${frame}.png`),
        ...['b', 'g', 'r', 'y'].flatMap((color) =>
          ['target', 'perfect_target', 'circle', 'judge'].map((name) => `sprites/${name}_${color}.png`))];
      const images = sources.map((src) => {
        const image = new Image();
        image.src = src;
        combatPreloads.push(image);
        return image.decode();
      });
      combatAssetsReady = Promise.all([hall.prepare(), ...images]).catch((error) => {
        combatAssetsReady = null;
        combatPreloads.length = 0;
        throw error;
      });
      return combatAssetsReady;
    }

    async function enterStageAfterOpening() {
      if (gameStarted) return;
      transitionLocked = true;
      await prepareCombatAssets();
      await runFadeTransition({
        fadeOutMs: 450,
        fadeInMs: 450,
        swap: async () => {
          opening.finish();
          gameStarted = true;
          stage.classList.add('game-running');
          firstWaveReadyAt = gameRuntime.now() + 450 + firstWaveDelayMs;
          updateHp();
          updateItemGauge();
          runAfterFirstWaveDelay(connectWebSocket);
          if (!tickStarted) {
            tickStarted = true;
            gameRuntime.requestAnimationFrame(tick);
          }
        }
      });
      transitionLocked = false;
    }

    function selectMode(mode, { voice = false } = {}) {
      const changed = selectedMode !== mode;
      selectedMode = mode;
      modeCards.forEach((card) => {
        card.classList.toggle('selected', card.dataset.mode === mode);
      });
      const detail = modeDetails[mode] ?? modeDetails['1p'];
      modeDescription.innerHTML = `<strong>${detail.title}</strong>${detail.body}`;
      if (voice && changed && modeVoiceSrc[mode]) {
        playAudioCue(modeVoiceSrc[mode]);
      }
    }

    function playOneShot(audio) {
      audio.pause();
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function playPooledEffect(src, volume = 0.88) {
      if (!effectSoundPools.has(src)) {
        effectSoundPools.set(src, []);
      }
      const pool = effectSoundPools.get(src);
      let audio = pool.find((item) => item.paused || item.ended);
      if (!audio) {
        audio = new Audio(src);
        audio.preload = 'auto';
        pool.push(audio);
      }
      audio.pause();
      audio.currentTime = 0;
      audio.volume = volume;
      audio.play().catch((error) => {
        console.warn(`[SFX] ${src} play failed:`, error);
      });
    }

    function playJudgementSound(judgementName) {
      if (judgementName === 'Miss') {
        playOneShot(missSound);
        return;
      }
      const activeGun = activeGunItem();
      const effectSrc = activeGun ? gunEffectSrc[activeGun.id] : '';
      if (effectSrc) {
        playPooledEffect(effectSrc);
        return;
      }
      playOneShot(gunSound);
    }

    function showItemName(item) {
      const presentation = itemPresentation[item.id];
      if (!presentation) return;
      document.querySelectorAll('.item-name-popup').forEach((popup) => popup.remove());
      const popup = document.createElement('div');
      popup.className = `item-name-popup ${presentation.tone}`;
      popup.textContent = presentation.label;
      stage.appendChild(popup);
      gameRuntime.setTimeout(() => popup.remove(), 1150);
    }

    function playItemCue(item) {
      const presentation = itemPresentation[item.id];
      if (!presentation?.voice) return;
      playAudioCue(presentation.voice);
    }

    function announceItem(item) {
      showItemName(item);
      playItemCue(item);
    }

    function hasActiveItem(id) {
      return activeItems.some((item) => item.id === id);
    }

    function activeEffectCount() {
      return activeItems.length;
    }

    function activeSupportCount() {
      return activeItems.filter((item) => isSupportItem(item)).length;
    }

    function isSupportItem(item) {
      return supportItemIds.has(item.id);
    }

    function isGunItem(item) {
      return gunItemIds.has(item.id);
    }

    function activeGunItem() {
      return activeItems.find((item) => isGunItem(item)) || null;
    }

    function sortActiveItems() {
      activeItems.sort((a, b) => {
        if (isGunItem(a) && !isGunItem(b)) return -1;
        if (!isGunItem(a) && isGunItem(b)) return 1;
        return a.startedAt - b.startedAt;
      });
    }

    function damageForJudgement(judgementName) {
      const range = config.damageByJudgement?.[judgementName.toLowerCase()] ?? { min: 0, max: 0 };
      const multiplier = hasActiveItem('power_up') ? 1.2 : 1;
      return Math.round(randomInt(range.min, range.max) * multiplier);
    }

    function hpDamageForJudgement(judgementName) {
      const base = config.hpDamageByJudgement[judgementName.toLowerCase()] ?? 0;
      return base > 0 ? base + (hasActiveItem('power_up') ? config.powerUpHpBonus : 0) : 0;
    }

    function applyEnemyHpDamage(target, amount) {
      if (target.isBoss) bossBattle.hit(amount);
      else target.hp = Math.max(0, target.hp - amount);
      drainEnemyHp(target, 0);
    }

    function formatScore(value) {
      return Math.floor(value).toLocaleString('en-US');
    }

    function animateScoreTo(nextScore, gainedScore) {
      gameRuntime.cancelAnimationFrame(scoreAnimationFrame);

      const startScore = displayedScore;
      const startTime = gameRuntime.now();
      const duration = Math.min(520, Math.max(170, gainedScore * 5));

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        displayedScore = Math.round(startScore + ((nextScore - startScore) * eased));
        scoreValue.textContent = formatScore(displayedScore);

        if (progress < 1) {
          scoreAnimationFrame = gameRuntime.requestAnimationFrame(step);
        } else {
          displayedScore = nextScore;
          scoreValue.textContent = formatScore(displayedScore);
        }
      }

      scoreAnimationFrame = gameRuntime.requestAnimationFrame(step);
    }

    function addScore(value) {
      if (value <= 0) return;
      score += value;
      animateScoreTo(score, value);
    }

    function scoreForHit(damage, target) {
      const comboMultiplier = 1 + Math.floor(combo / 5) * 0.05;
      const retryMultiplier = 1 - Math.min(2, target.dodgeTurns ?? 0) * 0.2;
      return Math.round(damage * comboMultiplier * retryMultiplier);
    }

    function showCombo() {
      if (combo < 5) return;
      document.querySelectorAll('.combo-popup').forEach((popup) => popup.remove());
      const popup = document.createElement('div');
      popup.className = 'combo-popup';
      popup.textContent = `${combo} combo!!`;
      stage.appendChild(popup);
      gameRuntime.setTimeout(() => popup.remove(), 780);
    }

    function comboGaugeBonus() {
      return Math.floor(combo / 5);
    }

    function registerComboHit() {
      combo += 1;
      showCombo();
      return comboGaugeBonus();
    }

    function resetCombo() {
      combo = 0;
    }

    function updateHp() {
      hp = Math.max(0, Math.min(100, hp));
      hpFill.style.width = `${hp}%`;
      hpText.textContent = `HP ${Math.round(hp)}`;
    }

    function damagePlayer(value) {
      if (stageEnded || value <= 0 || hasActiveItem('armor_vest')) return;
      hp -= value;
      updateHp();
      showHitBloodOverlay();
      if (hp === 0 && gameStarted) endGame();
    }

    function rewardLevel() {
      return selectedRewardLevel;
    }

    function isItemGaugeReady(level = 1) {
      return itemGauge >= itemGaugeMax * level;
    }

    function updateItemGauge() {
      const cappedGauge = Math.min(itemGauge, itemGaugeCap);
      const totalPercent = Math.floor(cappedGauge);
      const currentLevel = Math.min(3, Math.floor(cappedGauge / itemGaugeMax));
      itemGaugeFills.forEach((fill, index) => {
        const levelStart = index * itemGaugeMax;
        const levelProgress = Math.max(0, Math.min(cappedGauge - levelStart, itemGaugeMax));
        fill.style.width = `${(levelProgress / itemGaugeCap) * 100}%`;
        fill.style.left = `${(levelStart / itemGaugeCap) * 100}%`;
        fill.classList.toggle('ready', levelProgress >= itemGaugeMax);
      });

      gaugeRewardButtons.forEach((button) => {
        const level = Number(button.dataset.level);
        button.classList.toggle('visible', isItemGaugeReady(level) && !itemChoicesOpen && storedItems.includes(null));
      });
      itemGaugeLevel.textContent = `${currentLevel}`;
      itemGaugePercent.textContent = `${totalPercent}%`;
      const percentX = Math.max(0, Math.min(totalPercent / 300, 1)) * 100;
      itemGaugePercent.style.left = `${percentX}%`;
      itemGaugePercent.style.transform = percentX <= 4
        ? 'translateX(0)'
        : percentX >= 96
          ? 'translateX(-100%)'
          : 'translateX(-50%)';
    }

    function animateGaugeDrain(fromGauge, toGauge) {
      const fromPercent = Math.max(0, Math.min(fromGauge / itemGaugeCap, 1)) * 100;
      const toPercent = Math.max(0, Math.min(toGauge / itemGaugeCap, 1)) * 100;
      itemGaugeDrainFill.style.transition = 'none';
      itemGaugeDrainFill.style.opacity = '1';
      itemGaugeDrainFill.style.width = `${fromPercent}%`;
      itemGaugeFills.forEach((fill) => fill.classList.add('no-transition'));
      updateItemGauge();
      void itemGaugeDrainFill.offsetWidth;
      itemGaugeFills.forEach((fill) => fill.classList.remove('no-transition'));
      itemGaugeDrainFill.style.transition = 'width 520ms ease-out, opacity 160ms ease-out 520ms';
      itemGaugeDrainFill.style.width = `${toPercent}%`;
      itemGaugeDrainFill.style.opacity = '0';
      gameRuntime.setTimeout(() => {
        itemGaugeDrainFill.style.transition = 'none';
        itemGaugeDrainFill.style.width = `${toPercent}%`;
      }, 720);
    }

    function setItemChoicesOpen(open) {
      itemChoicesOpen = open;
      itemChoices.forEach((button, index) => {
        button.classList.toggle('visible', open && index < currentItemChoices.length);
      });
      if (!open) {
        currentItemChoices = [];
      }
      renderActiveItems();
      updateItemGauge();
    }

    function resetItemGauge() {
      itemGauge = 0;
      selectedRewardLevel = 1;
      updateItemGauge();
      setItemChoicesOpen(false);
    }

    function addItemGaugeFor(judgementName, bonus = 0) {
      const gain = gaugeByJudgement[judgementName] ?? 0;
      const totalGain = (gain + bonus) * itemGaugeGainMultiplier;
      if (totalGain <= 0 || itemGauge >= itemGaugeCap) return;
      itemGauge = Math.min(itemGauge + totalGain, itemGaugeCap);
      updateItemGauge();
    }

    function shuffleItems(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function openItemChoices() {
      const guns = shuffleItems(itemDefs.filter((item) => gunItemIds.has(item.id))).slice(0, 2);
      const support = ['power_up', 'slow_down', 'medkit', 'armor_vest']
        .map((id) => itemDefs.find((item) => item.id === id));
      currentItemChoices = [...guns, ...support];
      itemChoices.forEach((button, index) => {
        const item = currentItemChoices[index];
        button.innerHTML = item ? `<img src="${item.icon}" alt="${item.name}">` : '';
        button.dataset.itemId = item?.id ?? '';
        button.setAttribute('aria-label', item?.name ?? 'empty item');
      });
      setItemChoicesOpen(true);
    }

    function renderActiveItems() {
      effectGaugeRows.forEach((row, index) => {
        const item = activeItems[index];
        const icon = row.querySelector('.active-item-icon');
        const fill = row.querySelector('.effect-gauge-fill');
        const text = row.querySelector('.effect-gauge-text');
        row.classList.toggle('visible', Boolean(item));
        icon.innerHTML = item ? `<img src="${item.icon}" alt="">` : '';
        icon.classList.toggle('visible', Boolean(item));
        if (!item) {
          fill.style.width = '100%';
          text.textContent = '0%';
          return;
        }
        const remainingMs = Math.max(0, item.endsAt - gameRuntime.now());
        const percent = Math.max(0, Math.min((remainingMs / item.durationMs) * 100, 100));
        fill.style.width = `${percent}%`;
        text.textContent = `${Math.ceil(percent)}%`;
      });
    }

    function applyTimedItemStartEffect(item) {
      if (item.id === 'magnum') {
        applyMagnumToActiveTargets();
      } else if (item.id === 'slow_down') {
        const now = gameRuntime.now();
        activeTargets.forEach((target) => {
          if (target.judged) return;
          const elapsed = Math.max(0, now - target.startTime);
          const progress = Math.min(elapsed / target.duration, 0.72);
          target.duration = randomBetween(4000, 5000);
          if (now >= target.startTime) target.startTime = now - (target.duration * progress);
          target.perfectTime = target.startTime + (target.duration * perfectProgress);
        });
      }
    }

    function startTimedItem(item, level = rewardLevel()) {
      const durationMs = itemDurationByRewardLevel[level];
      const now = gameRuntime.now();
      const nextItem = {
        ...item,
        level,
        durationMs,
        startedAt: now,
        endsAt: now + durationMs
      };

      if (isGunItem(item)) {
        activeItems = activeItems.filter((entry) => !isGunItem(entry));
      } else if (isSupportItem(item)) {
        activeItems = activeItems.filter((entry) => entry.id !== item.id);
        if (activeSupportCount() >= 2) {
          const oldestSupportIndex = activeItems.findIndex((entry) => isSupportItem(entry));
          if (oldestSupportIndex >= 0) {
            activeItems.splice(oldestSupportIndex, 1);
          }
        }
      }

      activeItems.push(nextItem);
      sortActiveItems();

      applyTimedItemStartEffect(nextItem);
      renderActiveItems();
    }

    function clearActiveItem() {
      activeItems = [];
      renderActiveItems();
      updateItemGauge();
    }

    function updateActiveItemGauge() {
      if (activeItems.length === 0) {
        renderActiveItems();
        return;
      }
      const now = gameRuntime.now();
      activeItems = activeItems.filter((item) => item.endsAt > now);
      renderActiveItems();
    }

    function runAfterFirstWaveDelay(callback) {
      if (stageEnded || floorTransition) return;
      const remainingMs = Math.max(0, firstWaveReadyAt - gameRuntime.now());
      gameRuntime.setTimeout(() => { if (!stageEnded && !floorTransition) callback(); }, remainingMs);
    }

    function selectItem(item) {
      if (!gameStarted || stageEnded || gameRuntime.paused || !itemChoicesOpen) return;
      const slot = storedItems.indexOf(null);
      const level = rewardLevel();
      if (slot < 0 || !isItemGaugeReady(level)) return;
      storedItems[slot] = { ...item, level };
      setItemChoicesOpen(false);
      spendItemGauge(level);
      renderInventory();
    }

    function renderInventory() {
      inventoryButtons.forEach((button, index) => {
        const item = storedItems[index];
        button.disabled = !item || stageEnded;
        button.innerHTML = item ? `<img src="${item.icon}" alt=""><span>Lv.${item.level}</span>` : '';
        button.setAttribute('aria-label', item ? `Use ${item.name}, level ${item.level}` : `empty item slot ${index + 1}`);
      });
      updateItemGauge();
    }

    function useStoredItem(index) {
      if (!gameStarted || stageEnded || floorTransition || gameRuntime.paused) return;
      const item = storedItems[index];
      if (!item) return;
      storedItems[index] = null;
      announceItem(item);
      if (item.id === 'medkit') {
        hp = Math.min(100, hp + ({ 1: 10, 2: 30, 3: 50 }[item.level] ?? 10));
        updateHp();
      } else {
        startTimedItem(item, item.level);
      }
      renderInventory();
    }

    function spendItemGauge(level) {
      const previousGauge = itemGauge;
      itemGauge = Math.max(0, itemGauge - (itemGaugeMax * level));
      selectedRewardLevel = 1;
      if (level === 3 && previousGauge - itemGauge >= itemGaugeMax * 3) {
        animateGaugeDrain(previousGauge, itemGauge);
      } else {
        updateItemGauge();
      }
    }

    function showDamage(value, x, y) {
      if (value <= 0) return;

      const popup = document.createElement('div');
      popup.className = 'damage-popup';
      popup.textContent = `${value}`;
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      stage.appendChild(popup);
      gameRuntime.setTimeout(() => popup.remove(), 900);
    }

    function drainEnemyHp(target, amount = 100) {
      if (!target?.enemyHpFill) return;
      target.hp = target.isBoss ? bossBattle.hp : Math.max(0, target.hp - target.maxHp * amount / 100);
      target.visualHp = target.isBoss ? bossBattle.percent : target.hp / target.maxHp * 100;
      target.enemyHpFill.style.width = `${(enemyHpBarMaxWidth * target.visualHp) / 100}px`;
    }

    function showBulletEffect(x, y) {
      const frames = [
        'sprites/effects/bullet_effect_1.png',
        'sprites/effects/bullet_effect_2.png',
        'sprites/effects/bullet_effect_3.png'
      ];
      const effect = document.createElement('img');
      effect.className = 'bullet-effect';
      effect.src = frames[0];
      effect.alt = '';
      effect.style.left = `${x}px`;
      effect.style.top = `${y}px`;
      stage.appendChild(effect);

      gameRuntime.setTimeout(() => { effect.src = frames[1]; }, 55);
      gameRuntime.setTimeout(() => { effect.src = frames[2]; }, 110);
      gameRuntime.setTimeout(() => effect.remove(), 230);
    }

    function showEnemyMuzzleFlash(target) {
      const flash = document.createElement('img');
      flash.className = 'muzzle-flash';
      flash.src = 'sprites/effects/bullet_effect_1.png';
      flash.alt = '';
      const flashWidth = target.enemyHeight * enemyMuzzleFlashWidthRatio;
      const x = target.x + (target.enemyHeight * (enemyMuzzleOffsetXRatio + enemyMuzzleFineTuneXRatio));
      const y = target.enemyCenterY + (target.enemyHeight * (enemyMuzzleOffsetYRatio + enemyMuzzleFineTuneYRatio));
      flash.style.width = `${flashWidth}px`;
      flash.style.left = `${x}px`;
      flash.style.top = `${y}px`;
      stage.appendChild(flash);
      gameRuntime.setTimeout(() => flash.remove(), enemyMuzzleFlashMs);
    }

    function shakeStage() {
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
      gameRuntime.setTimeout(() => stage.classList.remove('shake'), 820);
    }

    function showHitBloodOverlay() {
      document.querySelectorAll('.hit-blood-overlay').forEach((overlay) => overlay.remove());
      const overlay = document.createElement('img');
      overlay.className = 'hit-blood-overlay';
      overlay.src = 'sprites/effects/hit_blood_overlay.png';
      overlay.alt = '';
      stage.appendChild(overlay);
      gameRuntime.setTimeout(() => overlay.remove(), 820);
    }

    function setTargetAimingVisible(target, visible) {
      const opacity = visible ? '1' : '0';
      target.target.style.opacity = opacity;
      target.perfect.style.opacity = opacity;
      target.circle.style.opacity = opacity;
      target.judge.classList.remove('visible');
      target.judge.style.opacity = visible ? '' : '0';
    }

    function setMachinePromptVisible(target, visible) {
      target.machinePrompt?.classList.toggle('visible', visible);
    }

    function setEnemySprite(target, sprite, reaction = false) {
      target.enemy.src = target.isBoss
        ? (reaction ? hall.config.boss.hitSprite : hall.config.boss.sprite)
        : sprite;
      target.enemy.classList.toggle('reaction', reaction && !target.isBoss);
    }

    function restartTargetTiming(target) {
      if (!target?.element.isConnected) return;
      const now = gameRuntime.now();
      target.duration = hasActiveItem('slow_down')
        ? randomBetween(4000, 5000)
        : randomBetween(config.spawnDurationMs?.min ?? 1180, config.spawnDurationMs?.max ?? 2600);
      target.startTime = now;
      target.perfectTime = target.startTime + (target.duration * perfectProgress);
      target.judged = false;
      target.countering = false;
      target.counterResolved = false;
      if (hasActiveItem('magnum')) setTargetColor(target, 'r');
      target.machineGunHit = false;
      target.machineGunState = null;
      target.hp = target.isBoss ? bossBattle.hp : target.maxHp;
      target.visualHp = target.isBoss ? bossBattle.percent : 100;
      target.enemyHpFill.style.width = `${(enemyHpBarMaxWidth * target.visualHp) / 100}px`;
      setMachinePromptVisible(target, false);
      setEnemySprite(target, enemySprites.aim, false);
      target.circle.style.transform = `translate(-50%, -50%) scale(${startScale})`;
      setTargetAimingVisible(target, true);
    }

    function scheduleCounterRetries() {
      gameRuntime.clearTimeout(counterRetryTimer);
      if (dodge.current || activeTargets.some((target) => target.countering && !target.counterResolved)) return;
      counterRetryTimer = gameRuntime.setTimeout(() => {
        if (dodge.current || activeTargets.some((target) => target.countering && !target.counterResolved)) return;
        activeTargets.filter((target) => target.countering).forEach((target) => {
          if (target.isBoss) {
            target.countering = false;
            target.counterResolved = false;
          } else restartTargetTiming(target);
        });
        if (currentFloor === 4) advanceBossTurnWhenReady();
      }, targetRetryAfterCounterMs);
    }

    function handleMissCounterattack(target) {
      if (!target || target.countering) return;
      target.countering = true;
      target.counterResolved = false;
      gameRuntime.clearTimeout(counterRetryTimer);
      target.judged = true;
      setTargetAimingVisible(target, false);

      const shotDelay = judgementHoldMs + 120 + missCounterDelayAfterTextMs;
      target.counterReadyAt = gameRuntime.now() + shotDelay;
      startDodgeTurnWhenReady();

    }

    function startDodgeTurnWhenReady() {
      gameRuntime.clearTimeout(dodgeTurnTimer);
      if (hasUnjudgedTargets() || dodge.current || dodge.queue.length) return;
      const failed = activeTargets.filter((target) => target.countering && !target.counterResolved);
      if (!failed.length) return;
      const readyAt = Math.max(...failed.map((target) => target.counterReadyAt));
      dodgeTurnTimer = gameRuntime.setTimeout(() => {
        if (hasUnjudgedTargets() || dodge.current || dodge.queue.length) return;
        dodge.enqueueBatch(failed.filter((target) => target.element.isConnected));
      }, Math.max(0, readyAt - gameRuntime.now()));
    }

    function clearActiveTargets() {
      gameRuntime.clearTimeout(dodgeTurnTimer);
      gameRuntime.clearTimeout(counterRetryTimer);
      dodge.clear();
      activeTargets.forEach((target) => target.element.remove());
      activeTargets = [];
    }

    function stopCombat() {
      hostage.clear();
      document.querySelectorAll('.hostage-warning').forEach(popup => popup.remove());
      hall.cancelDodge();
      stageEnded = true;
      gameStarted = false;
      gameRuntime.clearTimeout(nextSpawnTimer);
      gameRuntime.clearTimeout(localFallbackTimer);
      clearActiveTargets();
      setItemChoicesOpen(false);
      buttons.forEach((button) => {
        button.disabled = true;
        button.classList.remove('pressed');
      });
      gaugeRewardButtons.forEach((button) => { button.disabled = true; });
      itemChoices.forEach((button) => { button.disabled = true; });
      inventoryButtons.forEach((button) => { button.disabled = true; });
      stage.classList.remove('shake');
      document.getElementById('exitGame').hidden = true;
    }

    function completeStage() {
      if (stageEnded) return;
      if (currentFloor < 4) {
        const nextFloor = currentFloor + 1;
        const rooms = window.TIMING_SHOOTER_HALL;
        const nextConfig = nextFloor === 2 ? rooms.upperFloor : nextFloor === 3 ? rooms.diningRoom : rooms.bossRoom;
        enterNextRoom(nextConfig, nextFloor).catch((error) => {
          console.error('[Room] Could not prepare scene:', error);
          const screen = document.getElementById('floorLoading');
          screen.hidden = false;
          document.getElementById('floorLoadingCaption').hidden = false;
          document.getElementById('floorLoadingCaption').textContent = 'LOADING FAILED · TAP TO RETRY';
          document.getElementById('floorLoading').addEventListener('pointerdown', () => {
            floorTransition = false;
            completeStage();
          }, { once: true });
        });
        return;
      }
      stageCleared = true;
      stopCombat();
      stageClearScreen.hidden = false;
      animateClearResults();
    }

    async function enterNextRoom(config, nextFloor) {
      if (floorTransition || stageEnded) return;
      floorTransition = true;
      const startedAt = gameRuntime.now();
      const clearedWave = activeWaveId;
      gameStarted = false;
      hall.cancelDodge();
      gameRuntime.clearTimeout(nextSpawnTimer);
      gameRuntime.clearTimeout(localFallbackTimer);
      clearActiveTargets();
      setItemChoicesOpen(false);
      await waitMs(config.transitionDelayMs ?? 3000);
      const screen = document.getElementById('floorLoading');
      const image = document.getElementById('floorLoadingImage');
      document.getElementById('floorLoadingCaption').textContent = 'HOLD YOUR FIRE';
      document.getElementById('floorLoadingCaption').hidden = Boolean(config.captionInImage);
      screen.setAttribute('aria-label', nextFloor === 4 ? 'Entering boss room' : nextFloor === 3 ? 'Entering dining room' : 'Ascending stairs');
      image.alt = nextFloor === 4 ? 'Police entering the small door behind the dining table' : nextFloor === 3 ? 'Police entering the dining room' : 'Police ascending the stairs';
      image.style.objectFit = config.entryFit ?? (config.captionInImage ? 'contain' : 'cover');
      image.style.objectPosition = config.entryPosition ?? (config.captionInImage ? 'center' : '30% center');
      image.src = nextFloor >= 3
        ? (selectedMode === '2p' ? config.entryCoop : config.entryMale)
        : config.stairsMale;
      screen.hidden = false;
      await image.decode();
      stage.classList.remove('game-running');
      const nextHall = new HallScene(stage, config);
      try {
        const bossImage = new Image();
        const bossHitImage = new Image();
        if (config.boss) bossImage.src = config.boss.sprite;
        if (config.boss) bossHitImage.src = config.boss.hitSprite;
        await Promise.all([nextHall.prepare(), config.boss ? bossImage.decode() : Promise.resolve(), config.boss ? bossHitImage.decode() : Promise.resolve(), config.hostage ? hostage.prepare(config.hostage) : Promise.resolve(), waitMs(config.loadingHoldMs)]);
      } catch (error) {
        nextHall.destroy();
        throw error;
      }
      await runFadeTransition({ fadeOutMs: 350, fadeInMs: 350, swap: () => {
        hall.destroy();
        hall = nextHall;
        hall.onCameraChange = () => {
          activeTargets.forEach(positionHallTarget);
          hostage.position();
        };
        hall.setCamera(config.camera);
        spawnSlots = config.slots;
        currentFloor = nextFloor;
        bossBattle = config.boss ? new BossBattle(config.boss) : null;
        hostage.enter(config.hostage);
        stageEnemyTotal = config.enemyTotal;
        defeatedEnemies = 0;
        nextWaveReadyAt = 0;
        enemiesRemaining.textContent = String(stageEnemyTotal);
        activeItems.forEach((item) => { item.endsAt += gameRuntime.now() - startedAt; });
        floorTransition = false;
        gameStarted = true;
        stage.classList.add('game-running');
        screen.hidden = true;
        firstWaveReadyAt = gameRuntime.now() + 350 + firstWaveDelayMs;
      } });
      if (serverMode) sendSocket({ type: 'waveCleared', waveId: clearedWave });
      else runAfterFirstWaveDelay(spawnWave);
    }

    async function animateClearResults() {
      const shootScore = score;
      const remainingHp = Math.floor(hp);
      const shootRow = document.getElementById('clearShootRow');
      const hpRow = document.getElementById('clearHpRow');
      const totalRow = document.getElementById('clearTotalRow');
      const hpScoreValue = document.getElementById('clearHpScore');
      const totalScoreValue = document.getElementById('clearTotalScore');
      gameRuntime.cancelAnimationFrame(scoreAnimationFrame);
      displayedScore = shootScore;
      scoreValue.textContent = formatScore(shootScore);
      await waitMs(650);
      document.getElementById('clearShootScore').textContent = formatScore(shootScore);
      shootRow.classList.add('revealed');
      await waitMs(650);
      hpRow.classList.add('revealed');
      await waitMs(360);
      for (let converted = 1; converted <= remainingHp; converted++) {
        await waitMs(24);
        hp = remainingHp - converted;
        updateHp();
        hpScoreValue.textContent = formatScore(converted * 100);
      }
      await waitMs(450);
      const totalScore = shootScore + remainingHp * 100;
      totalRow.classList.add('revealed');
      shootRow.classList.add('summing');
      hpRow.classList.add('summing');
      const startedAt = gameRuntime.now();
      const updateTotal = (now) => {
        const progress = Math.min(1, (now - startedAt) / 850);
        totalScoreValue.textContent = formatScore(Math.round(totalScore * (1 - (1 - progress) ** 3)));
        if (progress < 1) gameRuntime.requestAnimationFrame(updateTotal);
        else {
          stageClearScreen.dataset.resultsComplete = 'true';
          window.astSubmitClearScore({ shootScore, remainingHp, hpScore: remainingHp * 100, totalScore });
window.dispatchEvent(new CustomEvent("public-stage-clear", { detail: { shootScore, remainingHp, hpScore: remainingHp * 100, totalScore } }));
          gameRuntime.setTimeout(() => {
            document.getElementById('clearReturnToTitle').hidden = false;
          }, 3000);
        }
      };
      gameRuntime.requestAnimationFrame(updateTotal);
    }

    function endGame() {
      if (stageEnded) return;
      stopCombat();
      hall.playDefeat();
      gameOverScreen.hidden = false;
    }

    gameOverScreen.addEventListener('animationend', (event) => {
      if (event.target !== gameOverScreen || event.animationName !== 'game-over-reveal') return;
      gameRuntime.setTimeout(() => { returnToTitleButton.hidden = false; }, 3000);
    });
    [stageClearScreen, gameOverScreen].forEach((screen) => {
      screen.addEventListener('click', () => {
        const button = screen.querySelector('.return-to-title');
        if (screen.hidden || button.hidden) return;
        window.location.reload();
      });
    });

    function finishTarget(target, reaction = 'hit') {
      if (stageEnded || floorTransition || !target || target.judged || !target.element.isConnected) return;
      if (target.isBoss) {
        finishBossTurnTarget(target);
        return;
      }

      const finishedTarget = target;
      finishedTarget.judged = true;
      drainEnemyHp(finishedTarget, 100);
      nextWaveReadyAt = gameRuntime.now() + randomBetween(config.respawnDelayMs?.min ?? 2000, config.respawnDelayMs?.max ?? 3000);
      if (currentFloor === 4) updateBossEnemyCount();
      else {
        defeatedEnemies = Math.min(stageEnemyTotal, defeatedEnemies + 1);
        enemiesRemaining.textContent = String(stageEnemyTotal - defeatedEnemies);
        if (defeatedEnemies === stageEnemyTotal) {
          completeStage();
          return;
        }
      }
      finishedTarget.machineGunState = null;
      setMachinePromptVisible(finishedTarget, false);
      finishedTarget.circle.style.opacity = '0';
      finishedTarget.judge.classList.remove('visible');
      if (reaction !== 'none') {
        setEnemySprite(finishedTarget, enemySprites[reaction] ?? enemySprites.hit, reaction === 'hit' || reaction === 'graze');
      }
      startDodgeTurnWhenReady();
      if (serverMode && !hasActiveOrCounteringTargets()) {
        sendSocket({ type: 'waveCleared', waveId: activeWaveId });
      }

      gameRuntime.setTimeout(() => {
        if (finishedTarget.element.isConnected) {
          finishedTarget.element.remove();
        }
        activeTargets = activeTargets.filter((item) => item !== finishedTarget);
        if (!stageEnded && !serverMode && !hasActiveOrCounteringTargets()) {
          scheduleSpawn(Math.max(0, nextWaveReadyAt - gameRuntime.now()));
        }
      }, judgementHoldMs);
    }

    function scheduleSpawn(delay = randomBetween(config.respawnDelayMs?.min ?? 2000, config.respawnDelayMs?.max ?? 3000)) {
      if (stageEnded || floorTransition) return;
      gameRuntime.clearTimeout(nextSpawnTimer);
      nextSpawnTimer = gameRuntime.setTimeout(spawnWave, delay);
    }

    function makeImage(className, src) {
      const img = document.createElement('img');
      img.className = className;
      img.src = `sprites/${src}`;
      img.alt = '';
      return img;
    }

    function slotById(slotId) {
      return spawnSlots.find((slot) => slot.id === slotId) || spawnSlots[0];
    }

    function makeTarget(color, slot, options = {}) {
      if (stageEnded || floorTransition) return;
      const effectiveColor = hasActiveItem('magnum') ? 'r' : color;
      const sprite = colors[effectiveColor];
      const element = document.createElement('div');
      const enemy = makeImage('enemy-img', 'enemies/mafia_gunman_aim_01.png');
      if (options.isBoss) enemy.src = hall.config.boss.sprite;
      const enemyMotion = document.createElement('div');
      enemyMotion.className = 'enemy-motion';
      enemyMotion.style.zIndex = slot.depth ?? 1;
      enemyMotion.append(enemy);
      const enemyCover = slot.clipBottomY != null ? document.createElement('div') : null;
      if (enemyCover) {
        enemyCover.className = 'enemy-cover';
        enemyCover.append(enemyMotion);
      }
      const target = makeImage('target-img', sprite.target);
      const perfect = makeImage('perfect-line-img', sprite.perfect);
      const circle = makeImage('circle-img', sprite.circle);
      const judge = makeImage('judge-img', sprite.judge);
      const enemyHp = document.createElement('div');
      const enemyHpFill = document.createElement('div');
      const enemyHpFrame = makeImage('enemy-hp-frame', 'UI/hp_frame.png');
      const machinePrompt = document.createElement('div');
      const machinePromptButton = makeImage('', sprite.target);
      const machinePromptText = document.createElement('span');

      element.className = 'target-set';
      enemyHp.className = 'enemy-hp';
      enemyHpFill.className = 'enemy-hp-fill';
      enemyHp.append(enemyHpFill, enemyHpFrame);
      machinePrompt.className = 'machine-push-prompt';
      machinePromptText.textContent = 'PUSH';
      machinePrompt.append(machinePromptButton, machinePromptText);
      element.append(enemyCover ?? enemyMotion, enemyHp, target, perfect, circle, judge, machinePrompt);
      stage.appendChild(element);

      const enemyHeight = stage.clientHeight * slot.heightRatio;
      const x = hall.screenX(slot.worldX);
      const y = stage.clientHeight * slot.footY - enemyHeight / 2;
      const aimOffset = -enemyHeight * 0.20;
      const duration = hasActiveItem('slow_down')
        ? randomBetween(4000, 5000)
        : (options.duration ?? randomBetween(config.spawnDurationMs?.min ?? 1180, config.spawnDurationMs?.max ?? 2600));

      element.style.left = `${x - circleBaseSize / 2}px`;
      element.style.top = `${y - circleBaseSize / 2}px`;
      enemy.style.height = `${enemyHeight}px`;
      enemyHp.style.top = `calc(50% + ${Math.round(enemyHeight * 0.55)}px)`;
      [target, perfect, circle, judge].forEach((image) => {
        image.style.top = `calc(50% + ${aimOffset}px)`;
      });
      machinePrompt.style.top = `calc(50% + ${aimOffset - 34}px)`;

      const now = gameRuntime.now();
      const riseMs = slot.rise ? hall.config.riseMs : 0;
      const startTime = (options.startAt ? Math.max(now, now + (options.startAt - Date.now())) : now) + (config.targetRevealDelayMs ?? 700);
      if (riseMs) {
        enemyMotion.animate([
          { transform: `translateY(${enemyHeight * 0.5}px)`, opacity: 0 },
          { transform: 'translateY(0)', opacity: 1 }
        ], { duration: riseMs, easing: 'ease-out' });
      }
      const newTarget = {
        isBoss: Boolean(options.isBoss),
        dodgeDurationMs: options.isBoss ? hall.config.boss.dodgeDurationMs : undefined,
        color: effectiveColor,
        originalColor: color,
        slotId: slot.id,
        targetId: options.id ?? `${slot.id}_${Date.now()}`,
        element,
        slot,
        enemy,
        enemyCover,
        enemyHp,
        enemyHpFill,
        target,
        perfect,
        circle,
        judge,
        machinePrompt,
        machinePromptButton,
        x,
        y: y + aimOffset,
        enemyHeight,
        enemyCenterY: y,
        startTime,
        duration,
        perfectTime: 0,
        judged: false,
        aimingPending: true,
        countering: false,
        machineGunHit: false,
        machineGunState: null,
        hp: options.isBoss ? bossBattle.hp : 1,
        maxHp: options.isBoss ? bossBattle.maxHp : 1,
        visualHp: 100
      };
      newTarget.perfectTime = newTarget.startTime + (newTarget.duration * perfectProgress);
      activeTargets.push(newTarget);
      setTargetAimingVisible(newTarget, false);
      positionHallTarget(newTarget);
      if (newTarget.isBoss) drainEnemyHp(newTarget, 0);
      return newTarget;
    }

    function positionHallTarget(target) {
      const { slot } = target;
      const height = stage.clientHeight * slot.heightRatio;
      const centerY = stage.clientHeight * slot.footY - height / 2;
      target.x = hall.screenX(slot.worldX);
      target.y = centerY - height * 0.20;
      target.enemyHeight = height;
      target.enemyCenterY = centerY;
      target.element.style.left = `${target.x - circleBaseSize / 2}px`;
      target.element.style.top = `${centerY - circleBaseSize / 2}px`;
      target.enemy.style.height = `${height}px`;
      if (target.enemyCover) {
        // This mask stays still while the character rises behind the fountain.
        const bottomInset = centerY + circleBaseSize / 2 - stage.clientHeight * slot.clipBottomY;
        target.enemyCover.style.clipPath = `inset(-100vh -100vw ${bottomInset}px -100vw)`;
      }
      target.enemyHp.style.top = `calc(50% + ${Math.round(height * 0.55)}px)`;
      [target.target, target.perfect, target.circle, target.judge].forEach((image) => {
        image.style.top = `calc(50% - ${height * 0.20}px)`;
      });
      target.machinePrompt.style.top = `calc(50% - ${height * 0.20 + 34}px)`;
    }

    function spawnWave(wave = null) {
      if (stageEnded || floorTransition) return;
      if (gameRuntime.now() < nextWaveReadyAt) {
        gameRuntime.clearTimeout(nextSpawnTimer);
        nextSpawnTimer = gameRuntime.setTimeout(() => spawnWave(wave), nextWaveReadyAt - gameRuntime.now());
        return;
      }
      if (currentFloor === 4) {
        spawnBossWave(wave);
        return;
      }
      clearActiveTargets();

      if (wave) {
        activeWaveId = wave.waveId;
        const roomSlots = currentFloor > 1 ? shuffleItems(spawnSlots) : [];
        wave.targets.slice(0, stageEnemyTotal - defeatedEnemies).forEach((target, index) => {
          makeTarget(target.color, currentFloor > 1 ? roomSlots[index % roomSlots.length] : slotById(target.slotId), {
            id: target.id,
            duration: target.duration,
            startAt: wave.startAt
          });
        });
        refreshHostageColor();
        updateHostageInput();
        return;
      }

      activeWaveId = `local_${Date.now()}`;
      const targetCount = Math.min(config.waveTargets ?? 3, stageEnemyTotal - defeatedEnemies);
      const availableSlots = [...spawnSlots].sort(() => Math.random() - 0.5).slice(0, targetCount);
      const waveColors = [];
      while (waveColors.length < targetCount) {
        const color = pickRandomColor();
        if (!waveColors.includes(color)) {
          waveColors.push(color);
        }
      }
      waveColors.sort(() => Math.random() - 0.5);
      waveColors.forEach((color, index) => makeTarget(color, availableSlots[index]));
      refreshHostageColor();
      updateHostageInput();
    }

    function updateBossEnemyCount() {
      enemiesRemaining.textContent = String((bossBattle.hp > 0 ? 1 : 0)
        + activeTargets.filter(target => !target.isBoss && !target.judged).length);
    }

    function advanceBossTurnWhenReady() {
      if (stageEnded || floorTransition || bossBattle?.advanceQueued || hasActiveOrCounteringTargets()
          || dodge.current || dodge.queue.length) return;
      bossBattle.advanceQueued = true;
      if (serverMode) sendSocket({ type: 'waveCleared', waveId: activeWaveId });
      else scheduleSpawn(Math.max(0, nextWaveReadyAt - gameRuntime.now()));
    }

    function finishBossTurnTarget(target) {
      target.judged = true;
      target.machineGunState = null;
      setMachinePromptVisible(target, false);
      setTargetAimingVisible(target, false);
      drainEnemyHp(target, 0);
      setEnemySprite(target, hall.config.boss.sprite, true);
      nextWaveReadyAt = gameRuntime.now() + randomBetween(config.respawnDelayMs.min, config.respawnDelayMs.max);
      handleMissCounterattack(target);
      gameRuntime.setTimeout(() => {
        if (target.element.isConnected && target.judged) setEnemySprite(target, hall.config.boss.sprite, false);
      }, judgementHoldMs);
    }

    function spawnBossWave(wave) {
      if (!bossBattle || bossBattle.hp === 0 || hasActiveOrCounteringTargets()) return;
      const existingBoss = activeTargets.find(target => target.isBoss);
      gameRuntime.clearTimeout(dodgeTurnTimer);
      gameRuntime.clearTimeout(counterRetryTimer);
      dodge.clear();
      activeTargets.filter(target => target !== existingBoss).forEach(target => target.element.remove());
      activeTargets = existingBoss ? [existingBoss] : [];
      const turn = bossBattle.nextTurn();
      bossBattle.advanceQueued = false;
      activeWaveId = wave?.waveId ?? `boss_${bossBattle.turn}_${Date.now()}`;
      let target = existingBoss;
      if (target) {
        restartTargetTiming(target);
        setTargetColor(target, hasActiveItem('magnum') ? 'r' : turn.color);
        if (!hasActiveItem('slow_down') && wave?.targets[0]?.duration) target.duration = wave.targets[0].duration;
        target.startTime = gameRuntime.now() + Math.max(0, (wave?.startAt ?? Date.now()) - Date.now()) + config.targetRevealDelayMs;
        target.perfectTime = target.startTime + target.duration * perfectProgress;
        target.aimingPending = true;
        setTargetAimingVisible(target, false);
      } else target = makeTarget(turn.color, spawnSlots[0], {
        isBoss: true, id: 'mafia_boss', duration: wave?.targets[0]?.duration, startAt: wave?.startAt
      });
      target.bossFlipColor = turn.flipColor;
      target.bossColorChanged = false;
      turn.guardColors.forEach((color, index) => makeTarget(color, spawnSlots[index + 1], {
        id: `boss_guard_${bossBattle.turn}_${index}`, duration: wave?.targets[index + 1]?.duration, startAt: wave?.startAt
      }));
      updateBossEnemyCount();
    }

    function updateBossTargetColor(target) {
      if (!target.isBoss || target.judged || target.machineGunState || target.bossColorChanged
          || hasActiveItem('magnum') || gameRuntime.now() < target.startTime + target.duration * hall.config.boss.colorChangeProgress) return;
      target.bossColorChanged = true;
      setTargetColor(target, target.bossFlipColor);
    }

    function judgementYFor(target) {
      return target.y - (perfectSize / 2) - 58;
    }

    function currentScale(target) {
      const elapsed = gameRuntime.now() - target.startTime;
      const progress = Math.min(Math.max(elapsed / target.duration, 0), 1);
      return startScale + (endScale - startScale) * progress;
    }

    function currentCircleDiameter(target) {
      return circleBaseSize * currentScale(target);
    }

    function currentTimingDeltaMs(target) {
      return gameRuntime.now() - target.perfectTime;
    }

    function hasUnjudgedTargets() {
      return activeTargets.some((target) => !target.judged);
    }

    function hasActiveOrCounteringTargets() {
      return activeTargets.some((target) => !target.judged || target.countering);
    }

    function targetForColor(color) {
      if (hasActiveItem('magnum')) {
        return color === 'r' ? mostUrgentTarget() : null;
      }
      return activeTargets
        .filter((target) => target.color === color && !target.judged && gameRuntime.now() >= target.startTime)
        .sort((a, b) => a.perfectTime - b.perfectTime)[0] || null;
    }

    function mostUrgentTarget() {
      return activeTargets
        .filter((target) => !target.judged && gameRuntime.now() >= target.startTime)
        .sort((a, b) => a.perfectTime - b.perfectTime)[0] || null;
    }

    function judgementMultiplier() {
      return hasActiveItem('sniper') ? sniperJudgementMultiplier : 1;
    }

    function effectiveWindow(baseMs) {
      return baseMs * judgementMultiplier();
    }

    function judgementForTarget(target) {
      const distance = Math.abs(currentTimingDeltaMs(target));
      if (distance <= effectiveWindow(perfectWindowMs)) {
        return { text: 'Perfect', colorText: '#ffd629' };
      }
      if (distance <= effectiveWindow(greatWindowMs)) {
        return { text: 'Great', colorText: '#39ff67' };
      }
      if (distance <= effectiveWindow(goodWindowMs)) {
        return { text: 'Good', colorText: '#3d8cff' };
      }
      if (distance <= effectiveWindow(badWindowMs)) {
        return { text: 'Bad', colorText: '#b15cff' };
      }
      return { text: 'Miss', colorText: '#ff3434' };
    }

    function setTargetColor(target, color) {
      const sprite = colors[color];
      target.color = color;
      target.target.src = `sprites/${sprite.target}`;
      target.perfect.src = `sprites/${sprite.perfect}`;
      target.circle.src = `sprites/${sprite.circle}`;
      target.judge.src = `sprites/${sprite.judge}`;
      target.machinePromptButton.src = `sprites/${sprite.target}`;
    }

    function applyMagnumToActiveTargets() {
      activeTargets.forEach((target) => {
        if ((target.judged && !target.countering) || target.color === 'r') return;
        setTargetColor(target, 'r');
      });
      refreshHostageColor(false);
    }

    function applyHitResult(target, result, options = {}) {
      if (stageEnded || !target.element.isConnected) return;
      const { keepAlive = false, silentMiss = false } = options;
      const { text, colorText } = result;

      playJudgementSound(text);
      if (text === 'Miss') {
        if (!silentMiss) {
          resetCombo();
          showJudgement('Miss', '#ff3434', target.x, judgementYFor(target));
          sendJudgement('Miss', target);
          handleMissCounterattack(target);
        }
        return;
      }

      showBulletEffect(target.x, target.y);
      const damage = damageForJudgement(text);
      const gaugeBonus = registerComboHit();
      showJudgement(text, colorText, target.x, judgementYFor(target));
      showDamage(damage, target.x, target.y + 3);
      applyEnemyHpDamage(target, hpDamageForJudgement(text));
      addScore(scoreForHit(damage, target));
      addItemGaugeFor(text, gaugeBonus);
      sendJudgement(text, target);
      if (target.isBoss && bossBattle.hp === 0) {
        enemiesRemaining.textContent = '0';
        completeStage();
        return damage;
      }

      if (keepAlive) {
        target.machineGunHit = true;
        setEnemySprite(target, text === 'Bad' ? enemySprites.graze : enemySprites.hit, true);
        gameRuntime.setTimeout(() => {
          if (target.element.isConnected && !target.judged) {
            setEnemySprite(target, enemySprites.aim, false);
          }
        }, 120);
        return damage;
      }

      finishTarget(target, text === 'Bad' ? 'graze' : 'hit');
    }

    function startMachineGunRoute(target, result, firstScore) {
      if (stageEnded || target.judged || !target.element.isConnected) return;
      const now = gameRuntime.now();
      target.machineGunHit = true;
      target.machineGunState = {
        result,
        shotsFired: 1,
        lastScore: firstScore,
        hpDamage: hpDamageForJudgement(result.text),
        startedAt: now,
        endsAt: now + machineGunHoldMs,
        lastInputAt: now
      };
      target.judge.classList.remove('visible');
      setMachinePromptVisible(target, false);
      gameRuntime.setTimeout(() => {
        if (target.element.isConnected && !target.judged && target.machineGunState) {
          finishTarget(target, 'hit');
        }
      }, machineGunHoldMs);
    }

    function applyMachineGunRepeatHit(target) {
      const state = target.machineGunState;
      if (!state || target.judged || !target.element.isConnected
          || state.shotsFired >= machineGunMaxShots || gameRuntime.now() >= state.endsAt) return;
      state.shotsFired += 1;
      state.lastScore = Math.floor(state.lastScore / 2);
      state.lastInputAt = gameRuntime.now();
      setMachinePromptVisible(target, false);
      playJudgementSound(state.result.text);
      showBulletEffect(target.x, target.y);
      showDamage(state.lastScore, target.x, target.y + 3);
      addScore(scoreForHit(state.lastScore, target));
      if (target.isBoss) applyEnemyHpDamage(target, state.hpDamage * hall.config.boss.machineGunRepeatMultiplier);
      if (target.isBoss && bossBattle.hp === 0) {
        enemiesRemaining.textContent = '0';
        completeStage();
        return;
      }
      setEnemySprite(target, state.result.text === 'Bad' ? enemySprites.graze : enemySprites.hit, true);
      gameRuntime.setTimeout(() => {
        if (target.element.isConnected && !target.judged) {
          setEnemySprite(target, enemySprites.aim, false);
        }
      }, 90);
      if (state.shotsFired === machineGunMaxShots) {
        finishTarget(target, 'hit');
      }
    }

    function applyShotgunResult(result) {
      const targets = activeTargets.filter((target) => !target.judged);
      targets.forEach((target) => {
        applyHitResult(target, result);
      });
    }

    function judgePressed(color) {
      if (stageEnded || gameRuntime.paused) return;
      if (tutorial.press(color)) return;
      if (opening.active) {
        opening.shoot(color);
        return;
      }
      if (!gameStarted) {
        return;
      }
      if (dodge.press(color)) return;
      updateHostageInput();
      if (hostage.press(color)) return;
      if (!hasUnjudgedTargets()) {
        return;
      }
      activeTargets.forEach(updateBossTargetColor);
      if (!mostUrgentTarget()) return;

      const target = targetForColor(color);
      if (!target) {
        if (hasActiveItem('machine_gun')) {
          playJudgementSound('Miss');
          return;
        }
        const urgentTarget = mostUrgentTarget();
        applyHitResult(urgentTarget, { text: 'Miss', colorText: '#ff3434' });
        return;
      }

      let result = judgementForTarget(target);

      if (hasActiveItem('machine_gun')) {
        if (target.machineGunState) {
          applyMachineGunRepeatHit(target);
          return;
        }
        if (result.text === 'Miss') {
          applyHitResult(target, result);
          return;
        }
        const firstScore = applyHitResult(target, result, { keepAlive: true, silentMiss: true });
        startMachineGunRoute(target, result, firstScore);
        return;
      }

      if (hasActiveItem('shotgun') && result.text !== 'Miss') {
        applyShotgunResult(result);
        return;
      }

      applyHitResult(target, result);
    }

    function updateButtonPress(button) {
      button.classList.add('pressed');
      gameRuntime.setTimeout(() => button.classList.remove('pressed'), 90);
    }

    function tick() {
      if (stageEnded) return;
      if (floorTransition) {
        gameRuntime.requestAnimationFrame(tick);
        return;
      }
      updateActiveItemGauge();
      dodge.update(gameRuntime.now());
      hall.updateDodge(gameRuntime.now());
      updateHostageInput();
      activeTargets.forEach((target) => {
        if (target.judged) return;
        if (gameRuntime.now() < target.startTime) return;
        updateBossTargetColor(target);
        if (target.aimingPending) {
          target.aimingPending = false;
          setTargetAimingVisible(target, true);
        }

        if (target.machineGunState) {
          const now = gameRuntime.now();
          if (now >= target.machineGunState.endsAt) {
            finishTarget(target, 'hit');
            return;
          }
          setMachinePromptVisible(target, now - target.machineGunState.lastInputAt >= machineGunPromptIdleMs);
          return;
        }

        const scale = currentScale(target);
        const timingDeltaMs = currentTimingDeltaMs(target);
        target.circle.style.transform = `translate(-50%, -50%) scale(${scale})`;
        const sniperActive = hasActiveItem('sniper');
        target.perfect.classList.toggle('sniper-assisted', sniperActive);
        target.judge.classList.toggle('sniper-assisted', sniperActive);
        const cueMultiplier = judgementMultiplier();
        const judgeVisible = timingDeltaMs >= -(judgeShowBeforePerfectMs * cueMultiplier)
          && timingDeltaMs <= (judgeHideAfterPerfectMs * cueMultiplier);
        target.judge.classList.toggle('visible', judgeVisible);

        const expiredByMachineGun = (hasActiveItem('machine_gun') || target.machineGunHit)
          && gameRuntime.now() > target.startTime + target.duration + autoMissMs;
        const expiredNormally = !hasActiveItem('machine_gun') && !target.machineGunHit && timingDeltaMs > autoMissMs;

        if (expiredByMachineGun || expiredNormally) {
          if (expiredByMachineGun && target.machineGunHit) {
            finishTarget(target, 'hit');
          } else {
            applyHitResult(target, { text: 'Miss', colorText: '#ff3434' });
          }
        }
      });

      gameRuntime.requestAnimationFrame(tick);
    }

    buttons.forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (gameRuntime.paused) return;
        if (!gameStarted && !opening.canShoot && !tutorial.active) return;
        resumeBgm();
        updateButtonPress(button);
        judgePressed(button.dataset.color);
      });
    });

    titleScreen.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (window.AST_GAME_CONFIG.embedded || window.AST_GAME_CONFIG.singlePlayer) {
        startGameMode({ fromTitle: true });
        return;
      }
      showModeSelect();
    });

    modeCards.forEach((card) => {
      card.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        resumeBgm();
        selectMode(card.dataset.mode, { voice: true });
      });
    });

    startGameButton.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (selectedMode !== '1p') return;
      startGameMode();
    });

    gaugeRewardButtons.forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (!gameStarted || stageEnded || gameRuntime.paused) return;
        resumeBgm();
        const level = Number(button.dataset.level);
        if (!isItemGaugeReady(level) || itemChoicesOpen || !storedItems.includes(null)) return;
        selectedRewardLevel = level;
        openItemChoices();
      });
    });

    itemChoices.forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (!gameStarted) return;
        resumeBgm();
        const item = itemDefs.find((entry) => entry.id === button.dataset.itemId);
        if (!item) return;
        selectItem(item);
      });
    });

    inventoryButtons.forEach((button, index) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        if (gameRuntime.paused) return;
        resumeBgm();
        useStoredItem(index);
      });
    });

    window.addEventListener('keydown', (event) => {
      if (gameRuntime.paused) return;
      const keyMap = {
        ArrowUp: 'b',
        ArrowLeft: 'g',
        ArrowDown: 'y',
        ArrowRight: 'r',
        KeyW: 'b',
        KeyA: 'g',
        KeyS: 'y',
        KeyD: 'r'
      };
      const color = keyMap[event.code];
      if (event.code === 'F2') {
        if (window.AST_GAME_CONFIG.embedded || window.AST_GAME_CONFIG.singlePlayer) return;
        if (!gameStarted) return;
        event.preventDefault();
        itemGauge = Math.min(itemGauge + itemGaugeMax, itemGaugeCap);
        updateItemGauge();
        return;
      }
      if (event.code === 'F4') {
        if (window.AST_GAME_CONFIG.embedded || window.AST_GAME_CONFIG.singlePlayer) return;
        if (!gameStarted) return;
        event.preventDefault();
        clearActiveItem();
        return;
      }
      if (!color) return;
      if (!gameStarted && !opening.canShoot && !tutorial.active) return;
      event.preventDefault();
      resumeBgm();
      const button = buttons.find((item) => item.dataset.color === color);
      if (button) updateButtonPress(button);
      judgePressed(color);
    });

    function sendSocket(payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify(payload));
    }

    function sendJudgement(text, target) {
      sendSocket({
        type: 'judgement',
        waveId: activeWaveId,
        targetId: target.targetId,
        judgement: text,
        color: target.color
      });
    }

    function connectWebSocket() {
      if (window.AST_GAME_CONFIG.embedded || window.AST_GAME_CONFIG.singlePlayer) {
        serverMode = false;
        setNetStatus('1P');
        runAfterFirstWaveDelay(spawnWave);
        return;
      }
      if (!('WebSocket' in window)) {
        setNetStatus('LOCAL');
        runAfterFirstWaveDelay(spawnWave);
        return;
      }

      socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);

      socket.addEventListener('open', () => {
        serverMode = true;
        gameRuntime.clearTimeout(localFallbackTimer);
        setNetStatus('SERVER');
      });

      socket.addEventListener('message', (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'hello') {
          ownServerLabel = `P${message.player} SERVER`;
          setNetStatus(ownServerLabel);
        } else if (message.type === 'wave') {
          serverMode = true;
          runAfterFirstWaveDelay(() => spawnWave(message));
        } else if (message.type === 'roster') {
          setNetStatus(`${ownServerLabel} / ${message.players.length}P`);
        }
      });

      socket.addEventListener('close', () => {
        serverMode = false;
        setNetStatus('LOCAL');
        if (!hasActiveOrCounteringTargets()) {
          runAfterFirstWaveDelay(() => scheduleSpawn());
        }
      });

      socket.addEventListener('error', () => {
        serverMode = false;
        setNetStatus('LOCAL');
      });

      localFallbackTimer = gameRuntime.setTimeout(() => {
        if (!serverMode && !hasActiveOrCounteringTargets()) {
          setNetStatus('LOCAL');
          runAfterFirstWaveDelay(spawnWave);
        }
      }, 900);
    }

    const loadingScreen = document.getElementById('loadingScreen');
    function showLoading(message) {
      loadingScreen.textContent = message;
      loadingScreen.hidden = false;
    }
    function hideLoading() { loadingScreen.hidden = true; }
    async function prepareTitle() {
      try {
        const image = new Image();
        image.src = 'sprites/Main/main_title.png';
        await Promise.all([image.decode(), loadBgmBuffer('sound/title.mp3')]);
        titleScreen.classList.remove('hidden');
        hideLoading();
        ensureTitleBgm();
      } catch (error) {
        console.error('[Title] Could not prepare title:', error);
        showLoading('로딩에 실패했습니다. 터치해서 다시 시도해주세요.');
        loadingScreen.addEventListener('pointerdown', () => {
          showLoading('게임을 실행중입니다');
          prepareTitle();
        }, { once: true });
      }
    }
    prepareTitle();
    window.setTimeout(() => {
      opening.prepare().catch((error) => console.warn('[Opening] Preload failed:', error));
      warmStageMusic({ decode: false });
    }, 0);
    window.addEventListener('load', ensureTitleBgm);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) ensureTitleBgm();
    });
    titleScreen.addEventListener('pointermove', ensureTitleBgm, { once: true });
    updateHp();
    updateItemGauge();
  </script>
<script src="ranking_config.js"></script>
<script src="public_ranking.js"></script>
</body>
