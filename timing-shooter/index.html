<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timing Shooter Prototype</title>
  <style>
    :root {
      --target-size: 36px;
      --perfect-size: 52px;
      --circle-size: 120px;
      --judge-size: 61px;
      --button-size: 43px;
      --enemy-height: 245px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    #stage {
      position: relative;
      width: min(100vw, 430px);
      height: 100dvh;
      min-height: 620px;
      overflow: hidden;
      background: #000 url("backgrounds/mafia_mansion_empty_01.png") center center / cover no-repeat;
    }

    #stage:not(.game-running) #judgement,
    #stage:not(.game-running) #hud,
    #stage:not(.game-running) #netStatus,
    #stage:not(.game-running) #itemGaugeHud,
    #stage:not(.game-running) #itemTray,
    #stage:not(.game-running) #inventory,
    #stage:not(.game-running) #activeEffects,
    #stage:not(.game-running) #enemyCounter,
    #stage:not(.game-running) #pad {
      display: none;
    }

    #stage.shake {
      animation: stage-shake 260ms ease-in-out 3;
    }

    #stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 38%, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.42) 72%),
        rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .front-screen {
      position: absolute;
      inset: 0;
      z-index: 90;
      display: flex;
      overflow: hidden;
      background: #000;
    }

    .front-screen.hidden {
      display: none;
    }

    #screenFade {
      position: absolute;
      inset: 0;
      z-index: 120;
      opacity: 0;
      background: #000;
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    #screenFade.visible {
      opacity: 1;
    }

    #loadingScreen {
      position: absolute;
      inset: 0;
      z-index: 140;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #ffdc45;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
      padding: 24px;
    }

    #loadingScreen[hidden] { display: none; }

    #floorLoading {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #000;
    }
    #floorLoading[hidden] { display: none; }
    #floorLoading img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% center;
    }
    #floorLoadingCaption {
      position: absolute;
      top: 15%;
      width: 100%;
      padding: 0 12px;
      color: #ffe28b;
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 2px 4px #000;
    }

    #titleScreen {
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
      background: #000 url("sprites/Main/main_title.png") center center / cover no-repeat;
    }

    #modeScreen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.12) 45%, rgba(0, 0, 0, 0.62)),
        radial-gradient(circle at 50% 26%, rgba(255, 206, 105, 0.1), rgba(0, 0, 0, 0.2) 62%);
      pointer-events: none;
    }

    .tap-to-start {
      position: absolute;
      left: 50%;
      bottom: 24%;
      z-index: 1;
      transform: translateX(-50%);
      color: #f7e6b8;
      font-size: clamp(19px, 5.8vw, 28px);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.9), 0 0 16px rgba(255, 206, 112, 0.58);
      white-space: nowrap;
      animation: tap-blink 1s steps(2, end) infinite;
      pointer-events: none;
    }

    #modeScreen {
      flex-direction: column;
      justify-content: center;
      gap: 11px;
      padding: max(12px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom));
      background: #05070a url("sprites/Main/background.png") center center / cover no-repeat;
    }

    #modeScreen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(2px);
    }

    .mode-title {
      position: relative;
      z-index: 1;
      margin: 0;
      padding-top: 0;
      color: #f4dfaa;
      font-size: clamp(22px, 6.2vw, 32px);
      font-weight: 900;
      text-align: center;
      letter-spacing: 0;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.8), 0 0 18px rgba(255, 195, 90, 0.44);
    }

    .mode-card-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 2px 12px 0;
      overflow: visible;
    }

    .mode-card {
      flex: 0 1 calc((100% - 42px) / 3);
      max-width: 125px;
      aspect-ratio: 1086 / 1448;
      padding: 0;
      border: 2px solid rgba(255, 220, 150, 0.46);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 185, 88, 0.14);
      transform: translateY(0);
      transition: transform 120ms ease, filter 120ms ease, border-color 120ms ease;
    }

    .mode-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .mode-card:active {
      transform: translateY(5px) scale(0.985);
      filter: brightness(1.12);
      border-color: rgba(255, 240, 190, 0.95);
    }

    .mode-card.selected {
      border-color: #ffd84a;
      filter: brightness(1.14) saturate(1.08);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.5),
        0 0 0 2px rgba(255, 216, 74, 0.35),
        0 0 24px rgba(255, 216, 74, 0.48);
    }

    .mode-description {
      position: relative;
      z-index: 1;
      width: calc(100% - 28px);
      height: 184px;
      margin: 2px auto 0;
      padding: 16px 16px 14px;
      border: 1px solid rgba(235, 196, 118, 0.5);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(10, 14, 20, 0.86), rgba(5, 7, 12, 0.78));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: rgba(246, 226, 184, 0.92);
      font-size: clamp(13px, 3.8vw, 16px);
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      overflow: hidden;
    }

    .mode-description strong {
      display: block;
      margin-bottom: 8px;
      color: #ffd874;
      font-size: clamp(17px, 5vw, 22px);
      letter-spacing: 0;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8);
    }

    #startGameButton {
      position: relative;
      z-index: 1;
      width: min(72%, 280px);
      min-height: 54px;
      margin: 2px auto 0;
      border: 1px solid rgba(255, 219, 124, 0.82);
      border-radius: 8px;
      color: #1a1208;
      background: linear-gradient(180deg, #ffe78e, #d9962e);
      box-shadow: 0 8px 0 rgba(70, 37, 10, 0.72), 0 0 22px rgba(255, 205, 88, 0.35);
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    #startGameButton:active {
      transform: translateY(7px);
      box-shadow: 0 1px 0 rgba(70, 37, 10, 0.72), 0 0 18px rgba(255, 205, 88, 0.42);
    }

    .target-set {
      position: absolute;
      z-index: 2;
      width: var(--circle-size);
      height: var(--circle-size);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .target-set img {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .enemy-img {
      z-index: 1;
      top: 70%;
      width: auto;
      height: var(--enemy-height);
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.6));
      transform: translate(-50%, -50%);
    }

    .enemy-img.reaction {
      transform: translate(-50%, -50%) scale(0.9);
    }

    .target-img {
      z-index: 2;
      width: var(--target-size);
      height: var(--target-size);
    }

    .perfect-line-img {
      z-index: 3;
      width: var(--perfect-size);
      height: var(--perfect-size);
    }

    .perfect-line-img.sniper-assisted {
      transform: translate(-50%, -50%) scale(1.55);
      filter: drop-shadow(0 0 10px rgba(255, 235, 150, 0.85));
    }

    .circle-img {
      z-index: 4;
      width: var(--circle-size);
      height: var(--circle-size);
      will-change: transform;
    }

    .judge-img {
      z-index: 5;
      width: var(--judge-size);
      height: var(--judge-size);
      opacity: 0;
      transition: opacity 55ms linear;
    }

    .judge-img.visible {
      opacity: 1;
    }

    .judge-img.sniper-assisted {
      transform: translate(-50%, -50%) scale(1.45);
      filter: drop-shadow(0 0 12px rgba(255, 235, 150, 0.75));
    }

    #judgement {
      position: absolute;
      left: 50%;
      top: 18%;
      z-index: 10;
      transform: translate(-50%, -50%);
      font-size: clamp(42px, 12vw, 104px);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.75), 0 0 24px currentColor;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    #judgement.show {
      animation: judgement-pop 540ms ease-out forwards;
    }

    .judgement-popup {
      position: absolute;
      z-index: 10;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 5vw, 42px);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 4px 0 rgba(0, 0, 0, 0.75), 0 0 24px currentColor;
      pointer-events: none;
      white-space: nowrap;
      animation: judgement-pop 540ms ease-out forwards;
    }

    .combo-popup {
      position: absolute;
      left: 50%;
      top: max(260px, 28%);
      z-index: 12;
      transform: translate(-50%, -50%);
      color: #ffd85a;
      font-size: clamp(24px, 7vw, 54px);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow:
        0 4px 0 rgba(0, 0, 0, 0.85),
        0 0 18px rgba(255, 200, 60, 0.9),
        0 0 32px rgba(255, 110, 30, 0.55);
      pointer-events: none;
      white-space: nowrap;
      animation: combo-pop 720ms ease-out forwards;
    }

    .damage-popup {
      position: absolute;
      z-index: 11;
      transform: translate(-50%, -50%);
      color: #ff2f2f;
      font-size: clamp(24px, 6vw, 48px);
      font-weight: 800;
      letter-spacing: 0;
      -webkit-text-stroke: 4.8px #fff;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #fff,
        3px -3px 0 #fff,
        -3px 3px 0 #fff,
        3px 3px 0 #fff,
        -5px 0 0 #fff,
        5px 0 0 #fff,
        0 -5px 0 #fff,
        0 5px 0 #fff,
        0 4px 0 rgba(0, 0, 0, 0.72),
        0 0 16px rgba(255, 40, 40, 0.35);
      pointer-events: none;
      white-space: nowrap;
      animation: damage-rise 430ms ease-out forwards;
    }

    .item-name-popup {
      position: absolute;
      left: 50%;
      top: max(300px, 33%);
      z-index: 13;
      transform: translate(-50%, -50%);
      font-size: clamp(18px, 4.9vw, 38px);
      font-weight: 900;
      letter-spacing: 0;
      -webkit-text-stroke: 3.4px #fff;
      paint-order: stroke fill;
      pointer-events: none;
      white-space: nowrap;
      text-shadow:
        -3px -3px 0 #fff,
        3px -3px 0 #fff,
        -3px 3px 0 #fff,
        3px 3px 0 #fff,
        -4px 0 0 #fff,
        4px 0 0 #fff,
        0 -4px 0 #fff,
        0 4px 0 #fff,
        0 4px 0 rgba(0, 0, 0, 0.75),
        0 0 18px currentColor;
      animation: item-name-pop 1050ms ease-out forwards;
    }

    .item-name-popup.weapon {
      color: #ff3030;
    }

    .item-name-popup.support {
      color: #35e868;
    }

    .bullet-effect {
      position: absolute;
      z-index: 9;
      width: 160px;
      height: auto;
      transform: translate(-50%, -50%);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: saturate(1.2) brightness(1.08);
    }

    .muzzle-flash {
      position: absolute;
      z-index: 8;
      width: 86px;
      height: auto;
      transform: translate(-50%, -50%) scaleX(-1);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: saturate(1.35) brightness(1.18);
    }

    .enemy-hp {
      position: absolute;
      left: 50%;
      z-index: 6;
      width: 142px;
      height: 17px;
      transform: translate(-50%, -50%) scale(0.65);
      pointer-events: none;
    }

    .enemy-hp-fill {
      position: absolute;
      left: calc(50% - 58.5px);
      top: calc(50% - 5px);
      z-index: 1;
      width: 117px;
      height: 10px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255, 160, 150, 0.95), rgba(178, 0, 18, 0.95) 48%, rgba(92, 0, 8, 0.98)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.14) 0 6px, rgba(0, 0, 0, 0.08) 6px 12px);
      box-shadow: inset 0 1px 0 rgba(255, 230, 220, 0.42), 0 0 8px rgba(255, 35, 35, 0.28);
      transition: width 360ms ease-out;
    }

    .enemy-hp-frame {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .machine-push-prompt {
      position: absolute;
      left: 50%;
      z-index: 8;
      display: none;
      align-items: center;
      gap: 4px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.7)) drop-shadow(0 0 10px rgba(255, 238, 120, 0.55));
    }

    .machine-push-prompt.visible {
      display: flex;
    }

    .machine-push-prompt img {
      position: static;
      width: 24px;
      height: 24px;
      transform: none;
      animation: machine-button-mash 260ms ease-in-out infinite;
    }

    .machine-push-prompt span {
      color: #ffe66d;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow: 0 0 10px rgba(255, 210, 60, 0.72);
      animation: machine-push-blink 520ms steps(2, end) infinite;
    }

    .hit-blood-overlay {
      position: absolute;
      inset: 0;
      z-index: 45;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      mix-blend-mode: screen;
      animation: hit-blood-flash 760ms ease-out forwards;
    }

    #hud {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 30;
      width: min(310px, calc(100% - 100px));
      padding: 10px 12px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(11, 16, 22, 0.86), rgba(7, 10, 14, 0.72));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
      pointer-events: none;
    }

    .score-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .hud-label {
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    #scoreValue {
      color: #ffffff;
      font-size: 38px;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 0 0 14px rgba(255, 220, 130, 0.28), 0 3px 0 rgba(0, 0, 0, 0.52);
    }

    .hp-row,
    .effect-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .hp-row {
      margin-bottom: 8px;
    }

    .hp-track {
      position: relative;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 2px 4px rgba(0, 0, 0, 0.48);
    }

    #hpFill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #db3241 0%, #ff5261 100%);
      box-shadow: 0 0 14px rgba(255, 82, 97, 0.28);
      transition: width 180ms ease-out;
    }

    #hpText {
      min-width: 58px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 11px;
      font-weight: 900;
      text-align: right;
    }

    .effect-row {
      position: absolute;
      left: 0;
      right: 150px;
      bottom: 48px;
      z-index: 7;
      display: none;
      grid-template-columns: 38px 1fr 36px;
      gap: 7px;
      align-items: center;
      height: 38px;
      pointer-events: none;
    }

    .effect-row[data-slot="2"] {
      bottom: 86px;
    }

    .effect-row[data-slot="3"] {
      bottom: 124px;
    }

    .effect-row.visible {
      display: grid;
    }

    .effect-track {
      position: relative;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
    }

    .effect-gauge-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffd45b 0%, #ff7445 100%);
      transition: width 120ms linear;
    }

    .effect-gauge-text {
      min-width: 36px;
      color: rgba(255, 238, 184, 0.92);
      font-size: 10px;
      font-weight: 900;
      text-align: right;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.85), 0 0 8px rgba(255, 195, 82, 0.38);
    }

    #netStatus {
      display: none;
      position: absolute;
      left: 10px;
      top: 94px;
      z-index: 30;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      pointer-events: none;
    }

    #exitGame {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 31;
      width: 56px;
      min-height: 44px;
      border: 1px solid #ffffff60;
      border-radius: 6px;
      color: #fff;
      background: #12171ee6;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .player-label { color: #fff; font-size: 14px; font-weight: 900; margin-bottom: 3px; }
    #enemyCounter {
      position: absolute; top: 65px; right: 12px; z-index: 30;
      display: flex; align-items: center; gap: 4px; pointer-events: none;
    }
    .enemy-face { position: relative; width: 30px; height: 36px; overflow: hidden; }
    .enemy-face img { position: absolute; width: 96px; max-width: none; left: -24px; top: -2px; }
    #enemiesRemaining { color: #fff; font-size: 30px; font-weight: 900; text-shadow: 0 2px 3px #000; }
    #activeEffects {
      position: absolute; left: 12px; top: 134px; width: min(310px, calc(100% - 100px));
      z-index: 30; pointer-events: none;
    }
    #activeEffects .effect-row {
      position: static; height: 30px; margin-bottom: 4px;
      grid-template-columns: 30px minmax(0, 1fr) 36px;
    }
    #activeEffects .active-item-icon { width: 30px; height: 26px; }
    #inventory {
      position: absolute; left: 14px; bottom: 92px; z-index: 20;
      width: min(252px, calc(100% - 170px)); display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
    }
    .inventory-slot {
      position: relative; height: 62px; min-width: 0; padding: 4px;
      border: 1px solid #ffe0a0; border-radius: 8px;
      background: linear-gradient(#ffdb9d, #d98e48); cursor: pointer;
    }
    .inventory-slot:disabled { background: #131a22b8; border-color: #ffffff50; cursor: default; }
    .inventory-slot img { width: 100%; height: 100%; object-fit: contain; }
    .inventory-slot span { position: absolute; right: 3px; bottom: 2px; font-size: 10px; font-weight: 900; color: #23150b; }
    .inventory-slot:active:not(:disabled) { transform: translateY(3px); }
    #stage:not(.game-running) #exitGame,
    #exitGame[hidden], #exitConfirm[hidden] { display: none; }
    #exitConfirm {
      position: absolute;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      background: #000b;
    }
    .exit-dialog {
      width: min(280px, calc(100% - 48px));
      padding: 28px 20px 20px;
      border: 1px solid #ffffff50;
      border-radius: 8px;
      background: #191d23;
      color: #fff;
      text-align: center;
    }
    .exit-dialog h2 { margin: 0 0 24px; font-size: 22px; }
    .exit-actions { display: flex; gap: 12px; }
    .exit-actions button { flex: 1; min-height: 44px; border: 1px solid #ffffff60; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; }

    const bgmPreloads = new Map();

    const bgmDownloads = new Map();
    const audioCueBuffers = new Map();
    let bgmContext = null;
    let bgmGain = null;

    function preloadBgm(src) {
      if (bgmPreloads.has(src)) return;
      const audio = new Audio(src);
      audio.preload = 'auto';
      audio.load();
      bgmPreloads.set(src, audio);
    }

    function ensureBgmContext() {
      if (bgmContext) return bgmContext;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      bgmContext = new AudioContextClass();
      bgmGain = bgmContext.createGain();
      bgmGain.gain.value = bgmVolume;
      bgmGain.connect(bgmContext.destination);
      cueGain = bgmContext.createGain();
      cueGain.gain.value = 0.9;
      cueGain.connect(bgmContext.destination);
      return bgmContext;
    }

    async function unlockBgm({ quiet = false } = {}) {
      const context = ensureBgmContext();
      if (!context) return false;
      try {
        if (context.state !== 'running') {
          await context.resume();
        }
        bgmUnlocked = context.state === 'running';
        return bgmUnlocked;
      } catch (error) {
        console.warn('[BGM] unlock failed:', error);
        if (!quiet) {
          reportAudioStatus('AUDIO BLOCKED');
        }
        return false;
      }
    }

    function downloadBgm(src) {
      if (bgmDownloads.has(src)) return bgmDownloads.get(src);
      const promise = fetch(src)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load ${src}: ${response.status}`);
          }
          return response.arrayBuffer();
        })
        .catch((error) => {
          bgmDownloads.delete(src);
          throw error;
        });
      bgmDownloads.set(src, promise);
      return promise;
    }

    function loadBgmBuffer(src) {
      if (bgmBuffers.has(src)) return bgmBuffers.get(src);
      const context = ensureBgmContext();
      if (!context) return Promise.reject(new Error('Web Audio is unavailable'));
      const promise = downloadBgm(src)
        .then((arrayBuffer) => context.decodeAudioData(arrayBuffer.slice(0)))
        .catch((error) => {
          bgmBuffers.delete(src);
          throw error;
        });
      bgmBuffers.set(src, promise);
      return promise;
    }

    function loadAudioCueBuffer(src) {
      if (audioCueBuffers.has(src)) return audioCueBuffers.get(src);
      const context = ensureBgmContext();
      const promise = fetch(src)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load ${src}: ${response.status}`);
          }
          return response.arrayBuffer();
        })
        .then((arrayBuffer) => context.decodeAudioData(arrayBuffer));
      audioCueBuffers.set(src, promise);
      return promise;
    }

    async function playAudioCue(src, { interrupt = true } = {}) {
      await unlockBgm();
      if (!bgmUnlocked) return false;
      try {
        const buffer = await loadAudioCueBuffer(src);
        if (interrupt) {
          activeCueSources.forEach((source) => {
            try { source.stop(); } catch {}
          });
          activeCueSources = [];
        }
        const context = ensureBgmContext();
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(cueGain);
        source.onended = () => {
          activeCueSources = activeCueSources.filter((item) => item !== source);
        };
        source.start(0);
        activeCueSources.push(source);
        return true;
      } catch (error) {
        console.warn(`[AUDIO CUE] ${src} failed:`, error);
        reportAudioStatus('AUDIO LOAD FAIL');
        return false;
      }
    }

    function stopWebBgmSources() {
      activeBgmSources.forEach((source) => {
        try {
          source.onended = null;
          source.stop();
        } catch {}
      });
      activeBgmSources = [];
    }

    function startWebBgmSource(buffer, { loop = false, onended = null } = {}) {
      const context = ensureBgmContext();
      const source = context.createBufferSource();
      source.buffer = buffer;
      source.loop = loop;
      source.connect(bgmGain);
      if (onended) {
        source.onended = onended;
      }
      source.start(0);
      activeBgmSources.push(source);
      return source;
    }

    function showJudgement(text, color, x = stage.clientWidth / 2, y = stage.clientHeight * 0.18) {

    async function playBgmLoop(mode, src) {
      if (bgmMode === mode && activeBgmSources.length > 0) return true;
      preloadBgm(src);
      bgmMode = mode;
      bgmSequenceToken += 1;
      const token = bgmSequenceToken;
      stopWebBgmSources();
      try {
        await unlockBgm({ quiet: mode === 'title' });
        if (!bgmUnlocked || token !== bgmSequenceToken || bgmMode !== mode) return false;
        const buffer = await loadBgmBuffer(src);
        if (token !== bgmSequenceToken || bgmMode !== mode) return false;
        startWebBgmSource(buffer, { loop: true });
        return true;
      } catch (error) {
        console.warn(`[BGM] ${src} load/play failed:`, error);
        reportAudioStatus('AUDIO LOAD FAIL');
        return false;
      }
    }

    async function playBgmSequence(mode, introSrc, loopSrc) {
      if (bgmMode === mode && activeBgmSources.length > 0) return true;
      preloadBgm(introSrc);
      preloadBgm(loopSrc);
      bgmMode = mode;
      bgmSequenceToken += 1;
      const token = bgmSequenceToken;
      stopWebBgmSources();
      try {
        await unlockBgm();
        if (!bgmUnlocked || token !== bgmSequenceToken || bgmMode !== mode) return false;
        const [introBuffer, loopBuffer] = await Promise.all([
          loadBgmBuffer(introSrc),
          loadBgmBuffer(loopSrc)
        ]);
        if (token !== bgmSequenceToken || bgmMode !== mode) return false;
        startWebBgmSource(introBuffer, {
          onended: () => {
            if (token !== bgmSequenceToken || bgmMode !== mode) return;
            activeBgmSources = activeBgmSources.filter((source) => source.buffer !== introBuffer);
            startWebBgmSource(loopBuffer, { loop: true });
          }
        });
        return true;
      } catch (error) {
        console.warn(`[BGM] ${mode} load/play failed:`, error);
        reportAudioStatus('AUDIO LOAD FAIL');
        return false;
      }
    }

    function resumeBgm() {
      return unlockBgm();
    }

    function stopBgm() {
      bgmSequenceToken += 1;
      bgmMode = '';
      stopWebBgmSources();
      bgm.pause();
      bgm.currentTime = 0;
      bgm.volume = bgmVolume;
    }

    function ensureTitleBgm() {
      if (gameStarted || transitionLocked || opening.active || titleScreen.classList.contains('hidden')) return;

    function waitMs(ms) {
      return new Promise((resolve) => gameRuntime.setTimeout(resolve, ms));

    function playGunAndWait(audio = gunSound) {
      playOneShot(audio);
      return new Promise((resolve) => {
        const fallbackMs = Number.isFinite(audio.duration) && audio.duration > 0
          ? (audio.duration * 1000) + 80
          : 1200;
        const timer = gameRuntime.setTimeout(done, fallbackMs);
        function done() {
          gameRuntime.clearTimeout(timer);
          audio.removeEventListener('ended', done);
          resolve();
        }
        audio.addEventListener('ended', done, { once: true });
      });
    }

    async function runFadeTransition({ fadeOutMs = 500, fadeInMs = 500, swap }) {
      screenFade.style.transition = `opacity ${fadeOutMs}ms ease`;
      screenFade.classList.add('visible');
      await waitMs(fadeOutMs);
      await swap();
      screenFade.style.transition = `opacity ${fadeInMs}ms ease`;
      screenFade.classList.remove('visible');
      await waitMs(fadeInMs);
    }
